<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cargo Enterprise Engine // Cloud Console</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #121824;
      --border: rgba(255, 255, 255, 0.08);
      --cyan: #00f0ff;
      --red: #ff4d6d;
      --green: #2ecc71;
      --text: #e6edf3;
      --muted: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
    body { background: var(--bg); color: var(--text); padding: 32px; }
    .container { max-width: 960px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { font-size: 1.5rem; color: var(--cyan); letter-spacing: 1px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
    .card { background: var(--card); border: 1px solid var(--border); padding: 16px; border-radius: 8px; }
    .card-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
    .card-value { font-size: 1.3rem; font-weight: bold; color: var(--cyan); }
    
    .panel { display: flex; gap: 8px; margin-bottom: 16px; }
    input, select { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 6px; outline: none; }
    input:focus, select:focus { border-color: var(--cyan); }
    button { background: var(--cyan); color: #000; border: none; font-weight: bold; padding: 10px 18px; border-radius: 6px; cursor: pointer; }
    
    .drop-zone { border: 2px dashed var(--border); border-radius: 8px; padding: 18px; text-align: center; margin-bottom: 24px; background: rgba(255,255,255,0.01); cursor: pointer; }
    .drop-zone.dragover { border-color: var(--cyan); background: rgba(0, 240, 255, 0.05); }

    ul { list-style: none; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    li { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    li:last-child { border-bottom: none; }
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; margin-left: 8px; }
    .badge-blob { background: #6f42c1; color: white; }
    .badge-kv { background: #0366d6; color: white; }
    .btn-del { background: transparent; border: 1px solid var(--red); color: var(--red); padding: 4px 8px; font-size: 0.75rem; margin-left: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>CARGO // ENTERPRISE</h1>
        <span style="color: var(--muted); font-size: 0.8rem;">Tier: <strong id="planName" style="color: var(--green);">...</strong></span>
      </div>
      <div style="display: flex; gap: 8px;">
        <select id="bucketSelect" onchange="refresh()">
          <option value="default">Bucket: default</option>
          <option value="assets">Bucket: assets</option>
          <option value="analytics">Bucket: analytics</option>
        </select>
        <button style="background: var(--green);" onclick="runCompaction()">⚡ COMPACT</button>
      </div>
    </header>

    <div class="grid">
      <div class="card">
        <div class="card-label">Active Records</div>
        <div id="statKeys" class="card-value">0</div>
      </div>
      <div class="card">
        <div class="card-label">Disk Consumption</div>
        <div id="statDisk" class="card-value">0 B</div>
      </div>
      <div class="card">
        <div class="card-label">Plan Quota Used</div>
        <div id="statQuota" class="card-value">0%</div>
      </div>
      <div class="card">
        <div class="card-label">Total Engine Ops</div>
        <div id="statOps" class="card-value">0</div>
      </div>
    </div>

    <!-- Key Value Input -->
    <form id="writeForm" class="panel">
      <input type="text" id="kInput" placeholder="Key (e.g. user:profile)" style="width: 30%;" required />
      <input type="text" id="vInput" placeholder="JSON or String payload" style="flex: 1;" required />
      <button type="submit">PUT KEY</button>
    </form>

    <!-- Blob Drag & Drop -->
    <div id="dropZone" class="drop-zone">
      <p style="color: var(--muted); font-size: 0.85rem;">📁 Drag & Drop any file (Image, PDF, Audio) here or <strong>Click to Upload Blob</strong></p>
      <input type="file" id="fileInput" style="display: none;" />
    </div>

    <h2 style="font-size: 0.85rem; margin-bottom: 10px; color: var(--muted);">INDEXED ENTRIES & BLOBS</h2>
    <ul id="entryList"></ul>
  </div>

  <script>
    const API_KEY = 'cargo_live_secret99';
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    function getBucket() {
      return document.getElementById('bucketSelect').value;
    }

    async function refresh() {
      const bucket = getBucket();
      const res = await fetch(`/api/${bucket}/telemetry`, { headers: { 'x-api-key': API_KEY } });
      const data = await res.json();

      document.getElementById('planName').innerText = data.plan.planName;
      document.getElementById('statKeys').innerText = data.keysCount;
      document.getElementById('statDisk').innerText = (data.diskUsageBytes / 1024).toFixed(2) + ' KB';
      document.getElementById('statQuota').innerText = data.plan.usagePercent + '%';
      document.getElementById('statOps').innerText = data.totalOperations;

      const list = document.getElementById('entryList');
      list.innerHTML = data.entries.map(e => `
        <li>
          <div>
            <strong>${e.key}</strong>
            <span class="badge ${e.isBlob ? 'badge-blob' : 'badge-kv'}">${e.isBlob ? e.mimeType : 'JSON/STRING'}</span>
            <span style="color: var(--muted); font-size: 0.75rem; margin-left: 8px;">(${(e.size / 1024).toFixed(1)} KB)</span>
          </div>
          <div>
            <button onclick="viewEntry('${e.key}', ${e.isBlob})" style="padding: 4px 10px; font-size: 0.75rem;">VIEW</button>
            <button class="btn-del" onclick="deleteEntry('${e.key}')">DEL</button>
          </div>
        </li>
      `).join('');
    }

    async function viewEntry(key, isBlob) {
      const bucket = getBucket();
      const url = `/api/${bucket}/payload/${key}?apiKey=${API_KEY}`;
      if (isBlob) {
        window.open(url, '_blank');
      } else {
        const res = await fetch(url, { headers: { 'x-api-key': API_KEY } });
        const json = await res.json();
        alert(JSON.stringify(json.value, null, 2));
      }
    }

    async function deleteEntry(key) {
      const bucket = getBucket();
      if (!confirm(`Delete ${key}?`)) return;
      await fetch(`/api/${bucket}/payload/${key}`, {
        method: 'DELETE',
        headers: { 'x-api-key': API_KEY }
      });
      refresh();
    }

    async function runCompaction() {
      const bucket = getBucket();
      const res = await fetch(`/api/${bucket}/compact`, {
        method: 'POST',
        headers: { 'x-api-key': API_KEY }
      });
      const data = await res.json();
      alert(`Compacted! Reclaimed ${(data.reclaimedBytes / 1024).toFixed(2)} KB.`);
      refresh();
    }

    // Key-Value Submit
    document.getElementById('writeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const bucket = getBucket();
      const key = document.getElementById('kInput').value;
      const value = document.getElementById('vInput').value;

      await fetch(`/api/${bucket}/payload/${key}`, {
        method: 'POST',
        headers: { 'x-api-key': API_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ value })
      });

      document.getElementById('kInput').value = '';
      document.getElementById('vInput').value = '';
      refresh();
    });

    // Drag and Drop File Upload
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) uploadFile(fileInput.files[0]);
    });

    async function uploadFile(file) {
      const bucket = getBucket();
      const formData = new FormData();
      formData.append('file', file);

      await fetch(`/api/${bucket}/blob/${encodeURIComponent(file.name)}`, {
        method: 'POST',
        headers: { 'x-api-key': API_KEY },
        body: formData
      });
      refresh();
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
